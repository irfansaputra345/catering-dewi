<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Menu - Catering Dewi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <button class="menu-toggle" id="menuToggle"><i class='bx bx-menu'></i></button>
        <h1 class="logo"><a href="index.html" style="color:white; text-decoration:none;">Catering Dewi Irfan</a></h1>
        <div class="header-right">
            <div class="opening-hours"><i class='bx bx-time'></i> 09:00 - 20:00</div>
            <button class="theme-toggle" id="themeToggle" title="Ganti Tema">🌙</button>
            <button class="review-btn" onclick="openReviewForm()" title="Ulasan Pembeli">
                <i class='bx bx-message-detail'></i>
                <span class="review-text">Ulasan</span>
            </button>
        </div>
    </header>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <button class="close-btn" id="closeSidebar"><i class='bx bx-x'></i></button>
        <ul>
            <li><a href="index.html"><i class='bx bx-home'></i> Home</a></li>
            <li><a href="menu.html"><i class='bx bxs-food-menu'></i> Menu</a></li>
            <li><a href="#" onclick="openTestimonialsModal()"><i class='bx bx-star'></i> Testimoni</a></li>
            <li><a href="contact.html"><i class='bx bx-edit'></i> Catatan Pembeli</a></li>
            <li><a href="#" onclick="toggleCart()"><i class='bx bx-cart'></i> Keranjang</a></li>
        </ul>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- PAGE HEADER -->
    <section class="page-header">
        <h2>Menu Kami</h2>
        <p>Pilihan terbaik untuk acara spesial Anda</p>
    </section>

    <!-- MENU LIST -->
    <section class="menu" id="menuList">
        <!-- Items will be rendered by script.js -->
    </section>

    <!-- CART -->
    <div class="cart" id="cart">
        <div class="cart-header">
            <h3>Keranjang Pesanan</h3>
            <button class="close-cart-btn" onclick="toggleCart()"><i class='bx bx-x'></i></button>
        </div>
        <ul id="cartItems"></ul>
        <p class="total">Total: Rp <span id="totalPrice">0</span></p>
        <button class="order-btn" onclick="orderNow()">Pesan Sekarang</button>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 Catering Dewi Irfan</p>
        <p>Nasi Box • Snack Box • Catering Harian</p>
        <p>📞 WhatsApp: 6285927326555</p>
    </footer>

    <!-- FLOATING CART -->
    <button class="floating-cart-btn" onclick="toggleCart()">
        <i class='bx bx-cart'></i>
        <span id="cartCount">0</span>
    </button>

    <script src="script.js"></script>
</body>

</html>
